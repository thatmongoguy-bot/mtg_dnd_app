<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MTG Assistant</title>
    <link rel="stylesheet" href="style.css" />
    <link href="https://cdn.jsdelivr.net/npm/@regularwave/beleren-bold-woff2@latest/css/beleren-bold-w2.css" rel="stylesheet" type="text/css" />
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/mana-font@latest/css/mana.min.css" />
</head>
<body>
    <main id="app">
        <header>
            <h1>⚔️ MTG Assistant ⚔️</h1>
            <div class="mana-bar">
                 <i class="ms ms-w"></i>
                 <i class="ms ms-u"></i>
                 <i class="ms ms-b"></i>
                 <i class="ms ms-r"></i>
                 <i class="ms ms-g"></i>
            </div>

        </header>

        <!-- Setup Screen -->
        <section id="setup-screen">
            <h2>Select Format</h2>
            <fieldset>
                <label><input type="radio" name="format" value="Standard" checked /> Standard (20 life)</label>
                <label><input type="radio" name="format" value="Commander" /> Commander (40 life)</label>
            </fieldset>

            <section id="player-setup">
                <h2>Players</h2>
                <label>
                    Number of players:
                    <input type="number" id="player-count" value="2" min="2" max="8" />
                </label>
                <div id="player-names"></div>
            </section>

            <button id="start-btn">Start Game</button>
        </section>

        <!-- Game Screen (hidden initially) -->
        <section id="game-screen" style="display: none;">
            <section id="players-container" aria-label="Player list"></section>
            <nav id="controls">
                <button id="roll-d20">🎲 Roll d20</button>
                <button id="roll-d6">🎲 Roll d6</button>
                <button id="next-turn">⏭ Next Turn</button>
            </nav>
            <!-- Card Search & Deck Builder -->
        <section id="card-section">
            <h2><i class="ms ms-tap"></i> Card Search</h2>
            
            <div class="search-row">
                <input type="text" id="card-search" placeholder="Search for a card..." />
                <button id="search-btn">Search</button>
            </div>

            <div id="card-result" hidden>
                <img id="card-image" src="" alt="Card image" />
                <div id="card-details">
                    <h3 id="card-name"></h3>
                    <p id="card-type"></p>
                    <p id="card-text"></p>
                    <p id="card-price"></p>
                    <button id="add-to-deck">Add to Deck</button>
                    <button id="card-close">Close</button>
                </div>
            </div>

            <h3>My Deck</h3>
            <ul id="deck-list"></ul>
            <div class="deck-actions">
                <button id="export-deck">Export Deck (JSON)</button>
                <button id="clear-deck">Clear Deck</button>
            </div>
        </section>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
