<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MTG Assistant</title>
    <link rel="stylesheet" href="style.css" />
    <link href="https://cdn.jsdelivr.net/npm/@regularwave/beleren-bold-woff2@latest/css/beleren-bold-w2.css" rel="stylesheet" type="text/css" />
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/mana-font@latest/css/mana.min.css" />
</head>
<body>
    <main id="app">
        <header>
            <h1>⚔️ MTG Assistant ⚔️</h1>
            <div class="mana-bar">
                 <i class="ms ms-w"></i>
                 <i class="ms ms-u"></i>
                 <i class="ms ms-b"></i>
                 <i class="ms ms-r"></i>
                 <i class="ms ms-g"></i>
            </div>

        </header>

        <!-- Setup Screen -->
        <section id="setup-screen">
            <h2>Select Format</h2>
            <fieldset>
                <label><input type="radio" name="format" value="Standard" checked /> Standard (20 life)</label>
                <label><input type="radio" name="format" value="Commander" /> Commander (40 life)</label>
            </fieldset>

            <section id="player-setup">
                <h2>Players</h2>
                <label>
                    Number of players:
                    <input type="number" id="player-count" value="2" min="2" max="8" />
                </label>
                <div id="player-names"></div>
            </section>

            <button id="start-btn">Start Game</button>
        </section>

        <!-- Game Screen (hidden initially) -->
        <section id="game-screen" style="display: none;">
            <section id="players-container" aria-label="Player list"></section>
            <nav id="controls">
                <button id="roll-d20">🎲 Roll d20</button>
                <button id="roll-d6">🎲 Roll d6</button>
                <button id="next-turn">⏭ Next Turn</button>
            </nav>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
